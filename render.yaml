# Prefer a Static Site (Dashboard) with:
#   Build Command: npm install && npm run build
#   Publish Directory: dist
#
# If you use a Web Service instead, this file / package.json "start" serves dist correctly.

services:
  - type: web
    name: smarttive-crm
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
